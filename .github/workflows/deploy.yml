name: Deploy Marketing

# Deploys wait for CI (2026-11-05). This workflow no longer runs on push:
# it is called by the CI workflow (ci.yml) as its last job, only after the
# checks have passed for the pushed commit, and it deploys exactly that
# commit (github.sha in a called workflow is the caller's commit). A commit
# whose CI fails never reaches the box.
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (pinned SHA, audit F-9)
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            # Fail the deploy when any step fails (a failed build used to
            # restart nginx on the old dist and still report success).
            set -eo pipefail
            # One deploy at a time per box, like the backend and the two
            # apps (2026-10-31: concurrent builds starved each other and hit
            # the SSH timeout). Waits up to 25 minutes for the lock.
            exec 9>/tmp/deload-deploy.lock
            flock -w 1500 9
            cd ~/deload/deload-marketing
            PREV_COMMIT=$(git rev-parse HEAD)
            git fetch origin main
            # Deploy the commit CI just passed, not whatever main points at now.
            # Two pushes close together finish CI in either order; if a newer
            # commit is already live (this one is its ancestor), skip rather than
            # roll the box back.
            SHA="${{ github.sha }}"
            if [ "$(git rev-parse HEAD)" != "$SHA" ] && git merge-base --is-ancestor "$SHA" HEAD; then
              echo "A newer commit ($(git rev-parse --short HEAD)) is already deployed; skipping $SHA."
              exit 0
            fi
            git merge --no-edit "$SHA"
            if ! git diff --quiet "$PREV_COMMIT" HEAD -- package.json pnpm-lock.yaml; then
              echo "Marketing dependencies changed. Running pnpm install..."
              pnpm install
            else
              echo "No marketing dependency changes. Skipping pnpm install."
            fi
            pnpm run build
            sudo chmod -R 755 ~/deload/deload-marketing/dist
            sudo systemctl restart nginx
