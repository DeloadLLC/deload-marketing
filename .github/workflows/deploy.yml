name: Deploy Marketing

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/deload/deload-marketing
            PREV_COMMIT=$(git rev-parse HEAD)
            git pull origin main
            if ! git diff --quiet "$PREV_COMMIT" HEAD -- package.json pnpm-lock.yaml; then
              echo "Marketing dependencies changed. Running pnpm install..."
              pnpm install
            else
              echo "No marketing dependency changes. Skipping pnpm install."
            fi
            pnpm run build
            sudo chmod -R 755 ~/deload/deload-marketing/dist
            sudo systemctl restart nginx
